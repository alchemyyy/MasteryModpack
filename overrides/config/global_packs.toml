# Global Packs configuration for Mastery.
# Paths are relative to the instance root, where config/, mods/, and datapacks/ live.
config_version=3

enable_system_global_packs = false
log_pack_ids = false

[resourcepacks]
required = []
enable_builtin = []

[datapacks]
required = [
    "datapacks/"
]
optional = []
enable_builtin = []
